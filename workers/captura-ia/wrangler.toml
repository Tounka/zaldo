name = "zaldo-captura-ia"
main = "src/index.js"
compatibility_date = "2025-09-01"

# Sin rutas públicas extra: solo la URL *.workers.dev del Worker.
workers_dev = true

[observability]
enabled = true

[vars]
# Público (es el mismo valor de VITE_FIREBASE_PROJECT_ID). Se usa para validar
# el `iss` y el `aud` del token de Firebase.
FIREBASE_PROJECT_ID = "zaldo-desarrollo"

# Orígenes que pueden llamar al Worker desde el navegador, separados por coma.
# Agrega aquí el dominio donde publicas la app (ej. "https://zaldo.ejemplo.com").
ORIGENES_PERMITIDOS = "https://zaldo-desarrollo.netlify.app,http://localhost:5173,http://127.0.0.1:5173"

# Modelo con soporte para Structured Outputs (response_format json_schema).
OPENAI_MODELO = "gpt-6-luna"

# Esfuerzo de razonamiento: none | low | medium | high | xhigh | max.
# La captura es una traducción corta de texto a JSON: medium basta.
OPENAI_ESFUERZO = "medium"

# El análisis redacta una presentación completa a partir de métricas: high.
OPENAI_ESFUERZO_ANALISIS = "high"

# Un reporte solo pide títulos, puntos y recomendaciones cortas: medium.
OPENAI_ESFUERZO_REPORTE = "medium"

# Respuesta amplia (cuando el asistente no supo con sus temas fijos): razona sobre todos los módulos.
OPENAI_ESFUERZO_RESPUESTA = "medium"

# Tarifas del modelo en USD por millón de tokens, para el costo estimado del
# consumo (src/consumo.js). Vacías = se cuentan los tokens pero el costo queda
# en 0. La caché vacía cobra como entrada normal. Al cambiar de modelo o de
# precio, actualízalas: el costo se calcula al momento de cada llamada.
# gpt-6-luna (developers.openai.com/api/docs/models/gpt-6-luna, oct 2026).
# No incluye las escrituras de caché (1.25x la entrada): el costo real queda
# un poco por encima del estimado.
PRECIO_ENTRADA_USD_MTOK = "0.10"
PRECIO_CACHE_USD_MTOK = "0.01"
PRECIO_SALIDA_USD_MTOK = "0.50"

# Secretos (NUNCA aquí; se cargan con `npx wrangler secret put <NOMBRE>`):
#   OPENAI_API_KEY   → key de OpenAI, idealmente de un proyecto solo para esto
#   UIDS_PERMITIDOS  → uids de Firebase autorizados, separados por coma
#   FIREBASE_SERVICE_ACCOUNT → JSON de la cuenta de servicio de Firebase
#                      (consola de Firebase → Configuración del proyecto →
#                      Cuentas de servicio → Generar nueva clave privada). Solo
#                      se usa para sumar el consumo de tokens en consumoIA
#                      (poner-cuenta-servicio.cmd)
# En local van en .dev.vars (ignorado por git; ver .dev.vars.example).

# Límite por usuario: 10 peticiones por minuto por uid.
[[ratelimits]]
name = "LIMITE_CAPTURA"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 10
  period = 60

# Análisis: 2 por minuto por uid. Cada uno cuesta mucho más que una captura.
[[ratelimits]]
name = "LIMITE_ANALISIS"
namespace_id = "1002"

  [ratelimits.simple]
  limit = 2
  period = 60

# Reportes: 4 por minuto por uid. Más barato que el análisis, más caro que una captura.
[[ratelimits]]
name = "LIMITE_REPORTE"
namespace_id = "1003"

  [ratelimits.simple]
  limit = 4
  period = 60

# Respuestas amplias: 3 por minuto por uid. Leen todos los módulos y razonan más.
[[ratelimits]]
name = "LIMITE_RESPUESTA"
namespace_id = "1004"

  [ratelimits.simple]
  limit = 3
  period = 60
